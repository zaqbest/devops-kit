# SSH hardening drop-in for /etc/ssh/sshd_config.d/99-devops-kit.conf
# Applied on systems that support Include (Ubuntu 22+, Debian 12+, RHEL 9+).
# For older systems, these directives are applied directly to sshd_config.

PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
AllowAgentForwarding no
TCPKeepAlive no
